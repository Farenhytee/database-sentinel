[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "database-sentinel"
version = "0.1.0"
description = "Supabase security audit: read-only MCP tools, lite LangGraph agent, Claude Skill."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND AGPL-3.0-only"
dependencies = [
  "mcp>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
agent = ["langgraph>=1.2,<2", "langchain-openai>=1.6,<2", "python-dotenv>=1,<2"]
dev = ["database-sentinel[agent]", "pyyaml>=6", "pytest>=8"]

[project.scripts]
sentinel-mcp = "database_sentinel.mcp_server.server:main"
sentinel-audit = "database_sentinel.agent.cli:main"

[project.urls]
Repository = "https://github.com/Farenhytee/database-sentinel"

[tool.hatch.build.targets.wheel]
packages = ["database_sentinel"]

[tool.hatch.build.targets.wheel.force-include]
"backends/supabase" = "database_sentinel/catalog/backends/supabase"
"core/scoring.md" = "database_sentinel/catalog/core/scoring.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
