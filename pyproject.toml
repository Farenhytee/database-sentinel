[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "database-sentinel"
version = "0.1.0"
description = "Supabase security audit: Claude Skill, LangGraph agent, MCP tools, benchmark."
requires-python = ">=3.11"
license = "MIT AND AGPL-3.0-only"
dependencies = [
  "langgraph>=1.2",
  "langchain-openai>=1.6",
  "mcp>=2.2",
  "psycopg[binary]>=3.2",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pyyaml>=6",
  "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["agent", "mcp_server", "evals"]

[tool.hatch.build.targets.wheel.force-include]
"backends/supabase" = "sentinel_catalog/backends/supabase"
"core/scoring.md" = "sentinel_catalog/core/scoring.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
